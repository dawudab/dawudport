
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OS Portfolio</title>
    <meta name="description" content="A retro-styled operating system interface showcasing a personal portfolio, projects, and contact information, built with React and Tailwind CSS.">
    <meta property="og:title" content="OS Portfolio">
    <meta property="og:description" content="A retro-styled operating system interface showcasing a personal portfolio, projects, and contact information, built with React and Tailwind CSS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #050507;
            color: #f4f4f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom subtle scrollbars for glass terminal windows */
        .terminal-style::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .terminal-style::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal-style::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 9999px;
        }
        .terminal-style::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* Mobile optimizations */
        @media (max-width: 640px) {
          .terminal-option {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
          }

          .terminal-style {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
          }

          .terminal-style p {
            max-width: 100%;
            overflow-wrap: break-word;
            word-break: break-word;
          }

          .terminal-option:active {
            transform: scale(0.99);
            transition: transform 0.1s ease;
          }
        }

        /* Loading dots animation */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-4px); opacity: 1; }
        }

        .animate-bounce {
            animation: bounce 0.9s infinite ease-in-out;
        }

        /* Blinking cursor animation for terminal */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .blinking-cursor-anim {
            animation: blink 1.1s step-end infinite;
        }

        /* Ticker scroll animation */
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-scroll-animate {
            animation: ticker-scroll 60s linear infinite;
        }
        @keyframes clock-scroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-clock-scroll {
          animation: clock-scroll 90s linear infinite;
        }

        /* Subtle glass sheen overlay for avatar */
        .scanlines-overlay-anim {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.18) 0%,
                rgba(255, 255, 255, 0.02) 45%,
                rgba(0, 0, 0, 0.25) 100%
            );
        }
    </style>
</head>
<body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
