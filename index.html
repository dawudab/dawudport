
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OS Portfolio</title>
    <meta name="description" content="A retro-styled operating system interface showcasing a personal portfolio, projects, and contact information, built with React and Tailwind CSS.">
    <meta property="og:title" content="OS Portfolio">
    <meta property="og:description" content="A retro-styled operating system interface showcasing a personal portfolio, projects, and contact information, built with React and Tailwind CSS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;700&family=Cairo:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif; /* Default font */
            /* Tailwind will handle bg and color on the root div */
        }
        /* Mobile optimizations */
        @media (max-width: 640px) {
          .terminal-option {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            margin: 0.25rem 0;
          }

          .terminal-style {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
          }

          .terminal-style p {
            max-width: 100%;
            overflow-wrap: break-word;
            word-break: break-word;
          }

          .terminal-option:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
          }
        }

        /* Loading dots animation */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .animate-bounce {
            animation: bounce 0.8s infinite ease-in-out;
        }

        /* Blinking cursor animation for terminal */
        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: #00ff41; }
        }
        .blinking-cursor-anim {
            animation: blink 1s step-end infinite;
        }

        /* Ticker scroll animation */
        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } /* Scroll one full copy */
        }
        .ticker-scroll-animate {
            animation: ticker-scroll 60s linear infinite;
        }
        @keyframes clock-scroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .animate-clock-scroll {
          animation: clock-scroll 90s linear infinite;
        }

        /* Scanlines animation (kept as CSS as it's background-position, complex for pure Tailwind) */
        @keyframes scanline-move {
            0% { background-position-y: 0; }
            100% { background-position-y: 80px; } /* Adjust based on avatar height */
        }
        .scanlines-overlay-anim {
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0),
                rgba(0, 0, 0, 0) 1px,
                rgba(0, 255, 65, 0.2) 2px,
                rgba(0, 255, 65, 0.2) 3px
            );
            animation: scanline-move 8s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
