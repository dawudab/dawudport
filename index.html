<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>L3-OS</title>
    <meta name="description" content="L3-OS — A classic retro 90s/2000s Linux X11 desktop portfolio for web and app development, system modernization, and community digital platforms.">
    <meta property="og:title" content="L3-OS">
    <meta property="og:description" content="L3-OS — A classic retro 90s/2000s Linux X11 desktop portfolio for web and app development, system modernization, and community digital platforms.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'IBM Plex Mono', 'Space Mono', monospace;
            background-color: #2b4c59;
            color: #111827;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            font-smooth: never;
            image-rendering: pixelated;
        }
        .font-pixel-ui {
            font-family: 'Silkscreen', 'Pixelify Sans', monospace;
        }
        .font-pixel-title {
            font-family: 'Pixelify Sans', 'Silkscreen', sans-serif;
        }
        .font-mono-body {
            font-family: 'IBM Plex Mono', 'Space Mono', monospace;
        }

        /* Classic 90s/2000s Linux X11 / CDE / XFCE 3D Beveled Borders */
        .x11-window-frame {
            background-color: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: inset 1px 1px 0px #ece9d8, inset -1px -1px 0px #808080, 4px 4px 0px rgba(0, 0, 0, 0.35);
        }
        .x11-outset {
            background-color: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: inset -1px -1px 0px #808080;
        }
        .x11-inset {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            box-shadow: inset 1px 1px 0px #404040;
        }
        .x11-btn {
            background-color: #d4d0c8;
            color: #111827;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: inset -1px -1px 0px #808080;
        }
        .x11-btn:hover {
            background-color: #dfdcd5;
        }
        .x11-btn:active,
        .x11-btn-depressed {
            background-color: #c0bcb4;
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            box-shadow: inset 1px 1px 0px #808080;
        }
        .x11-btn-primary {
            background-color: #1e3a5f;
            color: #ffffff;
            border-top: 2px solid #60a5fa;
            border-left: 2px solid #60a5fa;
            border-right: 2px solid #0f172a;
            border-bottom: 2px solid #0f172a;
        }
        .x11-btn-primary:hover {
            background-color: #254b7a;
        }
        .x11-btn-primary:active {
            background-color: #172d4a;
            border-top: 2px solid #0f172a;
            border-left: 2px solid #0f172a;
            border-right: 2px solid #60a5fa;
            border-bottom: 2px solid #60a5fa;
        }

        /* Classic retro Linux scrollbars */
        .terminal-style::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }
        .terminal-style::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-left: 1px solid #808080;
        }
        .terminal-style::-webkit-scrollbar-thumb {
            background: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
        }
        .terminal-style::-webkit-scrollbar-thumb:hover {
            background: #c0c0c0;
        }

        /* Authentic 16-bit Pixelated Dithered Slate-Teal / Steel-Blue Wallpaper */
        .x11-wallpaper-dither {
            background-color: #2b4c59;
            background-image:
                linear-gradient(45deg, #3a6ea5 25%, transparent 25%),
                linear-gradient(-45deg, #3a6ea5 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #3a6ea5 75%),
                linear-gradient(-45deg, transparent 75%, #3a6ea5 75%);
            background-size: 4px 4px;
            background-position: 0 0, 0 2px, 2px -2px, -2px 0;
            opacity: 0.35;
            image-rendering: pixelated;
        }

        @keyframes clock-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-clock-scroll {
            animation: clock-scroll 75s linear infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-clock-scroll {
                animation: none;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Mobile optimizations */
        @media (max-width: 640px) {
            .terminal-style {
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            .terminal-style p {
                max-width: 100%;
                overflow-wrap: break-word;
                word-break: break-word;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
